name: frontend-check

on:
  pull_request:
    paths:
      - "llm-platform/src/**"
      - "llm-platform/tests/**"
      - "llm-platform/vitest.config.mts"
      - "llm-platform/scripts/copy-scan.mjs"
      - "content/scripts/copy-rules.mjs"
      - ".github/workflows/frontend-check.yml"
  push:
    branches: [main]
    paths:
      - "llm-platform/src/**"
      - "llm-platform/tests/**"
      - "llm-platform/vitest.config.mts"
      - "llm-platform/scripts/copy-scan.mjs"
      - "content/scripts/copy-rules.mjs"
      - ".github/workflows/frontend-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: llm-platform/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: llm-platform

      - name: 前端文案扫描（§8.4 全量档）
        run: node scripts/copy-scan.mjs
        working-directory: llm-platform

      - name: ESLint
        run: npm run lint
        working-directory: llm-platform

  gamification-tests:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: llm-platform/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: llm-platform

      - name: npx prisma generate
        run: npx prisma generate
        working-directory: llm-platform

      - name: 准备本地测试数据库（SQLite）
        run: npx prisma db push --skip-generate
        working-directory: llm-platform
        env:
          DATABASE_URL: "file:./test.db"

      - name: 激励引擎专项测试（本地 SQLite）
        run: npm test
        working-directory: llm-platform
        env:
          DATABASE_URL: "file:./test.db"
